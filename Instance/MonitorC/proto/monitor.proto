syntax = "proto3";

package monitor;

service LoadMonitor {
  rpc RegisterClient (RegisterRequest) returns (RegisterResponse);
  rpc ReportLoad (LoadReport) returns (LoadResponse);
}

message RegisterRequest {
  string client_id = 1;
  string ip_address = 2;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}

message LoadReport {
  string client_id = 1;
  float load_value = 2; // 0.0 to 1.0
}

message LoadResponse {
  bool acknowledged = 1;
}
