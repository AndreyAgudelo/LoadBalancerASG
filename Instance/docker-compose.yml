version: '3.8'

services:
  app:
    image: instance-app
    build:
      context: ./App
    container_name: throttler
    privileged: true
    restart: always
    volumes:
      - /tmp/throttler/global_throttle:/tmp/global_throttle
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  monitor:
    image: instance-monitor
    build:
      context: ./MonitorC
    container_name: monitor_client
    env_file:
      - ./MonitorC/.env
    restart: always
    depends_on:
      - app
